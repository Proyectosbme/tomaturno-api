services:
  tomaturno-api:
    image: tomaturno-api:latest
    container_name: tomaturno-api
    restart: unless-stopped
    # network_mode: host permite que el contenedor use la red del host directamente
    # Asi la DB en 192.168.10.111 y Keycloak son accesibles sin config extra
    network_mode: host
    env_file:
      - .env.prod
